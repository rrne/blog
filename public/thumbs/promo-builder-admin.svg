<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 900" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <rect width="1160" height="900" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1159" height="899" fill="none" stroke="#e5e5e5"/>

  <!-- 페이지 타이틀 -->
  <text x="48" y="58" font-size="22" font-weight="700" fill="#222">페이지 수정</text>

  <!-- ===== 기본 정보 ===== -->
  <text x="48" y="100" font-size="16" font-weight="600" fill="#222">기본 정보</text>
  <line x1="128" y1="94" x2="1112" y2="94" stroke="#eee"/>
  <rect x="48" y="114" width="1064" height="88" fill="#f8f8f8"/>
  <!-- 페이지 명 -->
  <text x="68" y="140" font-size="12" fill="#555">페이지 명</text>
  <rect x="68" y="150" width="200" height="34" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="80" y="172" font-size="13" fill="#222">여름 시즌 특가</text>
  <!-- URL 설정 -->
  <text x="288" y="140" font-size="12" fill="#555">URL 설정</text>
  <rect x="288" y="150" width="180" height="34" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="300" y="172" font-size="13" fill="#222">summer-sale</text>
  <!-- 시작일시 -->
  <text x="488" y="140" font-size="12" fill="#555">시작일시</text>
  <rect x="488" y="150" width="190" height="34" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="500" y="172" font-size="13" fill="#222">2025-07-01 00:00</text>
  <text x="662" y="172" font-size="13" fill="#bbb">▾</text>
  <!-- 종료일시 -->
  <text x="698" y="140" font-size="12" fill="#555">종료일시</text>
  <rect x="698" y="150" width="190" height="34" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="710" y="172" font-size="13" fill="#222">2025-08-31 23:59</text>
  <text x="872" y="172" font-size="13" fill="#bbb">▾</text>
  <!-- 상태 -->
  <text x="908" y="140" font-size="12" fill="#555">상태</text>
  <rect x="908" y="154" width="64" height="26" rx="13" fill="#1677ff"/>
  <circle cx="959" cy="167" r="10" fill="#fff"/>
  <text x="922" y="171" font-size="11" fill="#fff">사용</text>

  <!-- ===== 메타 데이터 설정 ===== -->
  <text x="48" y="238" font-size="16" font-weight="600" fill="#222">메타 데이터 설정</text>
  <line x1="188" y1="232" x2="1112" y2="232" stroke="#eee"/>
  <rect x="48" y="252" width="1064" height="128" fill="#f8f8f8"/>
  <text x="68" y="278" font-size="12" fill="#555">메타 제목</text>
  <rect x="68" y="288" width="260" height="34" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="80" y="310" font-size="13" fill="#222">여름 시즌 특가 | 최대 40%</text>
  <text x="348" y="278" font-size="12" fill="#555">메타 설명</text>
  <rect x="348" y="288" width="420" height="34" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="360" y="310" font-size="13" fill="#222">여름 휴가를 위한 시즌 한정 특가와 쿠폰팩 혜택</text>
  <text x="68" y="348" font-size="12" fill="#555">OG 이미지</text>
  <rect x="68" y="356" width="36" height="16" rx="2" fill="#86cecb"/>
  <rect x="110" y="352" width="120" height="22" rx="4" fill="#fff" stroke="#d9d9d9"/>
  <text x="120" y="367" font-size="11" fill="#888">hero_summer.jpg</text>

  <!-- ===== 컨텐츠 ===== -->
  <text x="48" y="416" font-size="16" font-weight="600" fill="#222">컨텐츠</text>
  <line x1="110" y1="410" x2="1112" y2="410" stroke="#eee"/>

  <!-- Item 1: 이미지 (접힘) -->
  <rect x="48" y="430" width="1064" height="44" rx="12" fill="#f5f5f5" stroke="#e3e3e3"/>
  <text x="66" y="457" font-size="15" fill="#3d9ef8">≡</text>
  <text x="88" y="457" font-size="14" fill="#aaa">Item 1: 이미지</text>
  <text x="1042" y="457" font-size="12" fill="#999">▲　▼　✕</text>

  <!-- Item 2: 탭 (펼침) -->
  <rect x="48" y="490" width="1064" height="272" rx="12" fill="#F8FCFF" stroke="#91d5ff"/>
  <text x="66" y="519" font-size="15" fill="#3d9ef8">≡</text>
  <text x="88" y="519" font-size="14" font-weight="600" fill="#222">Item 2: 탭</text>
  <text x="1042" y="519" font-size="12" fill="#999">▲　▼　✕</text>
  <line x1="48" y1="534" x2="1112" y2="534" stroke="#e6f4ff"/>
  <!-- 요소 타입 -->
  <text x="68" y="558" font-size="12" fill="#555">요소 타입</text>
  <rect x="68" y="566" width="170" height="32" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="80" y="587" font-size="13" fill="#222">탭</text>
  <text x="222" y="587" font-size="12" fill="#bbb">▾</text>
  <!-- 색상 필드 4종 -->
  <text x="268" y="558" font-size="12" fill="#555">활성화 배경 색상</text>
  <rect x="268" y="566" width="130" height="32" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <rect x="276" y="573" width="18" height="18" rx="4" fill="#86cecb"/>
  <text x="302" y="587" font-size="12" fill="#222">#86CECB</text>
  <text x="418" y="558" font-size="12" fill="#555">활성화 글자 색상</text>
  <rect x="418" y="566" width="130" height="32" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <rect x="426" y="573" width="18" height="18" rx="4" fill="#ffffff" stroke="#ddd"/>
  <text x="452" y="587" font-size="12" fill="#222">#FFFFFF</text>
  <text x="568" y="558" font-size="12" fill="#555">비활성화 배경 색상</text>
  <rect x="568" y="566" width="130" height="32" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <rect x="576" y="573" width="18" height="18" rx="4" fill="#000000"/>
  <text x="602" y="587" font-size="12" fill="#222">#000000</text>
  <text x="718" y="558" font-size="12" fill="#555">비활성화 글자 색상</text>
  <rect x="718" y="566" width="130" height="32" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <rect x="726" y="573" width="18" height="18" rx="4" fill="#ffffff" stroke="#ddd"/>
  <text x="752" y="587" font-size="12" fill="#222">#FFFFFF</text>
  <!-- 탭 목록 -->
  <text x="68" y="630" font-size="12" fill="#555">탭 목록</text>
  <text x="68" y="652" font-size="12" font-weight="600" fill="#0894FF">탭 이름</text>
  <text x="348" y="652" font-size="12" font-weight="600" fill="#0894FF">연결될 이미지 ID</text>
  <rect x="68" y="660" width="260" height="30" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="80" y="680" font-size="13" fill="#222">혜택 1</text>
  <rect x="348" y="660" width="260" height="30" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="360" y="680" font-size="13" fill="#222">benefit1</text>
  <text x="622" y="680" font-size="13" fill="#bbb">⊗</text>
  <rect x="68" y="698" width="260" height="30" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="80" y="718" font-size="13" fill="#222">혜택 2</text>
  <rect x="348" y="698" width="260" height="30" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="360" y="718" font-size="13" fill="#222">benefit2</text>
  <text x="622" y="718" font-size="13" fill="#bbb">⊗</text>
  <rect x="660" y="698" width="180" height="30" rx="6" fill="none" stroke="#aaa" stroke-dasharray="5 4"/>
  <text x="716" y="718" font-size="12" fill="#555">+ 탭 추가</text>

  <!-- Item 3, 4 (접힘) -->
  <rect x="48" y="778" width="1064" height="44" rx="12" fill="#f5f5f5" stroke="#e3e3e3"/>
  <text x="66" y="805" font-size="15" fill="#3d9ef8">≡</text>
  <text x="88" y="805" font-size="14" fill="#aaa">Item 3: 버튼(리워드(쿠폰/포인트))</text>
  <text x="1042" y="805" font-size="12" fill="#999">▲　▼　✕</text>

  <!-- + Add Item / 하단 버튼 -->
  <rect x="48" y="836" width="700" height="40" rx="6" fill="none" stroke="#aaa" stroke-dasharray="6 4"/>
  <text x="360" y="861" font-size="13" font-weight="600" fill="#555">+ Add Item</text>
  <rect x="932" y="840" width="80" height="34" rx="6" fill="#fff" stroke="#d9d9d9"/>
  <text x="947" y="862" font-size="13" fill="#555">목록으로</text>
  <rect x="1024" y="840" width="80" height="34" rx="6" fill="#1677ff"/>
  <text x="1050" y="862" font-size="13" fill="#fff">저장</text>
</svg>
