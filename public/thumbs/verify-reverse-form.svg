        <rect x="52" y="506" width="22" height="32" rx="4"/><rect x="78" y="506" width="22" height="32" rx="4"/><rect x="104" y="506" width="22" height="32" rx="4"/><rect x="130" y="506" width="22" height="32" rx="4"/><rect x="156" y="506" width="22" height="32" rx="4"/><rect x="182" y="506" width="22" height="32" rx="4"/><rect x="208" y="506" width="22" height="32" rx="4"/><rect x="234" y="506" width="22" height="32" rx="4"/>
