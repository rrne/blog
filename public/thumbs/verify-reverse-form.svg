        <rect x="654" y="546" width="76" height="30" rx="5"/><rect x="736" y="546" width="76" height="30" rx="5"/><rect x="818" y="546" width="76" height="30" rx="5"/>
        <rect x="654" y="582" width="76" height="30" rx="5"/><rect x="736" y="582" width="76" height="30" rx="5"/><rect x="818" y="582" width="76" height="30" rx="5"/>
