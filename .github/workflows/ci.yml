name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 사내 고유명사가 남아있으면 여기서 머지가 막힌다
      - name: 민감정보 검사
        run: node scripts/sanitize-check.mjs

      # 프로덕션 빌드는 draft를 제외하므로 깨진 초안 MDX가 빌드를 통과한다.
      # draft 포함 전체를 컴파일해 사각지대를 막는다
      - name: MDX 컴파일 검사 (draft 포함)
        run: npm run check:mdx

      # typecheck는 빌드가 생성하는 라우트 타입(PageProps·LayoutProps)에
      # 의존한다. 빌드 전에 타입만 먼저 생성해 순서 문제를 없앤다
      - run: npx next typegen

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      # 블로그는 전 페이지가 정적이어야 한다. 동적 렌더링이 끼어들면 조용히
      # CDN 캐싱을 잃으므로 빌드는 성공해도 여기서 막는다
      - name: 정적 생성 검증
        run: npm run check:static
