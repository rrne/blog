name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 사내 고유명사가 남아있으면 여기서 머지가 막힌다
      - name: 민감정보 검사
        run: node scripts/sanitize-check.mjs

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      # 블로그는 전 페이지가 정적이어야 한다. 동적 렌더링이 끼어들면 조용히
      # CDN 캐싱을 잃으므로 빌드는 성공해도 여기서 막는다
      - name: 정적 생성 검증
        run: npm run check:static
